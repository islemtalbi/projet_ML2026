[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[coverage:run]
source = src
omit =
    src/api/main.py
    */tests/*
    */__init__.py

[coverage:report]
show_missing = true
skip_covered = false
fail_under = 70

[flake8]
max-line-length = 100
ignore = E203, W503
exclude = .git, __pycache__, .dvc, notebooks

[isort]
profile = black
line_length = 100

[mypy]
python_version = 3.11
ignore_missing_imports = true
